<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keylytics - Speed & Accuracy Practice</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    h1 {
      text-align: center;
      color: #38bdf8;
      font-size: 32px;
      margin-bottom: 25px;
      font-weight: 700;
    }

    .stats-container {
      display: flex;
      justify-content: space-around;
      background: #334155;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .stat-box {
      text-align: center;
    }

    .stat-box span {
      display: block;
      font-size: 24px;
      font-weight: bold;
      color: #38bdf8;
    }

    .stat-box label {
      font-size: 14px;
      color: #94a3b8;
    }

    .text-display {
      background: #0f172a;
      border: 2px solid #334155;
      padding: 20px;
      border-radius: 8px;
      font-size: 18px;
      line-height: 1.6;
      height: 140px;
      overflow-y: auto;
      margin-bottom: 20px;
      user-select: none;
      white-space: pre-wrap;
    }

    .correct {
      color: #4ade80;
    }

    .incorrect {
      color: #f87171;
      background-color: rgba(248, 113, 113, 0.2);
      border-radius: 2px;
    }

    .current {
      border-bottom: 2px solid #38bdf8;
    }

    textarea {
      width: 100%;
      height: 120px;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      padding: 15px;
      font-size: 18px;
      resize: none;
      outline: none;
    }

    textarea:focus {
      border-color: #38bdf8;
    }

    .controls {
      display: flex;
      justify-content: flex-end;
      margin-top: 15px;
    }

    .btn {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 10px 22px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn:hover {
      background: #0284c7;
      color: #ffffff;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Keylytics</h1>

  <!-- Stats Dashboard -->
  <div class="stats-container">
    <div class="stat-box">
      <span id="timer">60s</span>
      <label>Time Remaining</label>
    </div>
    <div class="stat-box">
      <span id="wpm">0</span>
      <label>WPM</label>
    </div>
    <div class="stat-box">
      <span id="accuracy">100%</span>
      <label>Accuracy</label>
    </div>
  </div>

  <!-- Passage Display -->
  <div class="text-display" id="textDisplay"></div>

  <!-- Typing Input Area -->
  <textarea id="typingInput" placeholder="Start typing here to begin the test..."></textarea>

  <div class="controls">
    <button class="btn" onclick="resetTest()">Restart</button>
  </div>
</div>

<script>
  const samplePassage = "Practice makes a person perfect. Typing regularly with proper accuracy and speed helps in mastering stenography and computer speed examinations. Keylytics provides real-time feedback on your performance.";

  let timeLimit = 60;
  let timeLeft = timeLimit;
  let timer = null;
  let isTestStarted = false;
  let totalTypedChars = 0;
  let correctTypedChars = 0;

  const textDisplay = document.getElementById("textDisplay");
  const typingInput = document.getElementById("typingInput");
  const timerDisplay = document.getElementById("timer");
  const wpmDisplay = document.getElementById("wpm");
  const accuracyDisplay = document.getElementById("accuracy");

  function initTest() {
    textDisplay.innerHTML = "";
    samplePassage.split("").forEach((char, index) => {
      const span = document.createElement("span");
      span.innerText = char;
      if (index === 0) span.classList.add("current");
      textDisplay.appendChild(span);
    });
  }

  typingInput.addEventListener("input", () => {
    if (!isTestStarted) {
      isTestStarted = true;
      startTimer();
    }

    const arrayQuote = textDisplay.querySelectorAll("span");
    const arrayValue = typingInput.value.split("");

    correctTypedChars = 0;
    totalTypedChars = arrayValue.length;

    arrayQuote.forEach((characterSpan, index) => {
      const character = arrayValue[index];

      characterSpan.classList.remove("current");

      if (character == null) {
        characterSpan.classList.remove("correct", "incorrect");
      } else if (character === characterSpan.innerText) {
        characterSpan.classList.add("correct");
        characterSpan.classList.remove("incorrect");
        correctTypedChars++;
      } else {
        characterSpan.classList.add("incorrect");
        characterSpan.classList.remove("correct");
      }
    });

    if (arrayValue.length < arrayQuote.length) {
      arrayQuote[arrayValue.length].classList.add("current");
    }

    // Live Metrics Calculation
    calculateMetrics();
  });

  function startTimer() {
    timer = setInterval(() => {
      if (timeLeft > 0) {
        timeLeft--;
        timerDisplay.innerText = `${timeLeft}s`;
        calculateMetrics();
      } else {
        clearInterval(timer);
        typingInput.disabled = true;
      }
    }, 1000);
  }

  function calculateMetrics() {
    let timeSpent = timeLimit - timeLeft;
    if (timeSpent <= 0) timeSpent = 1;

    // WPM Calculation (5 characters = 1 word standard)
    let wpm = Math.round((correctTypedChars / 5) / (timeSpent / 60));
    wpmDisplay.innerText = wpm >= 0 && !isNaN(wpm) ? wpm : 0;

    // Accuracy Calculation
    let accuracy = totalTypedChars > 0 ? Math.round((correctTypedChars / totalTypedChars) * 100) : 100;
    accuracyDisplay.innerText = `${accuracy}%`;
  }

  function resetTest() {
    clearInterval(timer);
    timeLeft = timeLimit;
    isTestStarted = false;
    totalTypedChars = 0;
    correctTypedChars = 0;

    timerDisplay.innerText = `${timeLimit}s`;
    wpmDisplay.innerText = "0";
    accuracyDisplay.innerText = "100%";
    
    typingInput.value = "";
    typingInput.disabled = false;
    
    initTest();
  }

  // Initialize on Load
  initTest();
</script>

</body>
</html>
